<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Androws">
  <title>Androws wordmark</title>
  <defs>
    <linearGradient id="wm" x1="104" y1="60" x2="408" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DDC84"/><stop offset="0.5" stop-color="#1FB6A6"/><stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <g id="body-w">
      <path d="M148 118 L116 66" stroke="url(#wm)" stroke-width="26" stroke-linecap="round" fill="none"/>
      <path d="M364 118 L396 66" stroke="url(#wm)" stroke-width="26" stroke-linecap="round" fill="none"/>
      <path d="M104 224 A152 152 0 0 1 408 224 Z" fill="url(#wm)"/>
      <path d="M118 224 H394 a14 14 0 0 1 14 14 V394 a14 14 0 0 1 -14 14 H118 a14 14 0 0 1 -14 -14 V238 a14 14 0 0 1 14 -14 Z" fill="url(#wm)"/>
    </g>
    <clipPath id="w-tl"><rect x="0"   y="0"   width="247" height="215"/></clipPath>
    <clipPath id="w-tr"><rect x="265" y="0"   width="247" height="215"/></clipPath>
    <clipPath id="w-bl"><rect x="0"   y="233" width="247" height="279"/></clipPath>
    <clipPath id="w-br"><rect x="265" y="233" width="247" height="279"/></clipPath>
    <clipPath id="silw">
      <path d="M104 224 A152 152 0 0 1 408 224 Z"/>
      <rect x="104" y="224" width="304" height="184" rx="14"/>
    </clipPath>
  </defs>
  <g transform="translate(6,14) scale(0.3)">
    <g clip-path="url(#w-tl)"><use href="#body-w"/></g>
    <g clip-path="url(#w-br)"><use href="#body-w"/></g>
    <g clip-path="url(#w-tr)"><use href="#body-w"/><g clip-path="url(#silw)"><rect x="265" y="0" width="247" height="215" fill="#fff" opacity="0.13"/></g></g>
    <g clip-path="url(#w-bl)"><use href="#body-w"/><g clip-path="url(#silw)"><rect x="0" y="233" width="247" height="279" fill="#fff" opacity="0.13"/></g></g>
    <g fill="#0E1620"><circle cx="192" cy="152" r="19"/><circle cx="320" cy="152" r="19"/></g>
  </g>
  <text x="182" y="120" font-family="'IBM Plex Sans','Segoe UI',Roboto,system-ui,sans-serif"
        font-size="104" font-weight="600" letter-spacing="-2" fill="#0E1620">Androws</text>
  <text x="188" y="158" font-family="'IBM Plex Mono',ui-monospace,monospace"
