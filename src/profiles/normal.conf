# Androws profile: normal
# Target: 2-4 GB RAM, integrated graphics. Both runtimes stay warm.
# Author: Saeed x Claude
ANDROWS_PROFILE=normal

ZRAM_SIZE=512
ZRAM_ALGO=zstd           # more RAM to spare, so take the better ratio
SWAPPINESS=100
KSM=1

GOVERNOR=schedutil

WLR_RENDERER=gles2
LABWC_EFFECTS=on
REFRESH_CAP=0            # follow the panel

DROID_LOW_RAM=false
DROID_HEAP_GROWTH=192m
DROID_HEAP_MAX=384m
DROID_SF_BUFFERS=3
DROID_DEX2OAT_FILTER=speed

WINE_ESYNC=1
WINE_VIDMEM=256
WINE_RENDERER=gl
