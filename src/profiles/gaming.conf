# Androws profile: gaming
# Target: 4 GB+ and a real GPU. One app gets everything; the other world goes cold.
# Author: Saeed x Claude
ANDROWS_PROFILE=gaming

ZRAM_SIZE=128            # small: swapping during a frame is the thing to avoid
ZRAM_ALGO=lz4
SWAPPINESS=10            # keep the game resident, reclaim from anything else
KSM=0                    # page scanning costs CPU that frames need

GOVERNOR=performance

WLR_RENDERER=gles2
LABWC_EFFECTS=off        # no shadows or animations competing for the GPU
UNREDIRECT_FULLSCREEN=1  # fullscreen app talks to the display directly
REFRESH_CAP=0

DROID_LOW_RAM=false
DROID_HEAP_GROWTH=384m
DROID_HEAP_MAX=512m
DROID_SF_BUFFERS=3
DROID_DEX2OAT_FILTER=everything

WINE_ESYNC=1
WINE_FSYNC=1
WINE_VIDMEM=1024
WINE_RENDERER=vulkan     # falls back to gl when DXVK is not installed
WINE_LARGE_ADDRESS=1

# Services that can wait until the session is idle again.
PAUSE_SERVICES="androws-registry-scan syslog chronyd"
