# Androws profile: low
# Target: 512 MB - 1 GB RAM, no usable GPU. This is the default.
# Author: Saeed x Claude
ANDROWS_PROFILE=low

# --- memory ---------------------------------------------------------------
ZRAM_SIZE=256
ZRAM_ALGO=lz4            # decompress latency matters more than ratio here
SWAPPINESS=150           # push anonymous pages out early, zram is cheap
KSM=1                    # two runtimes share a lot of identical pages

# --- cpu ------------------------------------------------------------------
GOVERNOR=schedutil

# --- graphics -------------------------------------------------------------
WLR_RENDERER=pixman      # software, because assuming a GPU here is optimistic
LABWC_EFFECTS=off
REFRESH_CAP=60

# --- android --------------------------------------------------------------
DROID_LOW_RAM=true
DROID_HEAP_GROWTH=64m
DROID_HEAP_MAX=128m
DROID_SF_BUFFERS=2
DROID_DEX2OAT_FILTER=speed-profile

# --- wine -----------------------------------------------------------------
WINE_ESYNC=0             # eventfd per thread is real memory at this size
WINE_VIDMEM=64
WINE_RENDERER=gl
