# Build an Androws image on a GitHub runner, so you do not need your own Linux box.
# The two inputs Androws never redistributes are passed in as URLs you control.
# Author: Saeed x Claude
name: build-image

on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: "URL of an AOSP GSI: a .zip from developer.android.com/topic/generic-system-image/releases (aosp_x86_64 row), or a raw system.img / .img.xz"
        required: true
      wine_url:
        description: "URL of a Wine source tarball, 9.0 or newer"
        required: true
        default: "https://dl.winehq.org/wine/source/9.0/wine-9.0.tar.xz"
      profile:
        description: "Default profile baked into the image"
        required: true
        default: "low"
        type: choice
        options: [low, normal, gaming]

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # A kernel build plus a GSI plus a Wine tree does not fit next to the
        # runner's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison libelf-dev libssl-dev \
            bc squashfs-tools zstd parted dosfstools mtools f2fs-tools curl python3 \
            gcc-multilib libfreetype-dev libx11-dev libwayland-dev

      - name: Fetch the inputs you supplied
        run: |
          mkdir -p work/input
          curl -fL "${{ inputs.gsi_url }}"  -o work/input/gsi.download
          curl -fL "${{ inputs.wine_url }}" -o work/input/wine-9.0.tar.xz

          # The Google GSI release page hands out a .zip with system.img inside it
          # (plus boot.img, vbmeta.img, etc). A raw or xz-compressed system.img is
          # also accepted directly, so this branches on what actually came back
          # rather than assuming one shape.
          kind="$(file -b work/input/gsi.download)"
          echo "downloaded: $kind"
          case "$kind" in
            *Zip*)
              unzip -o work/input/gsi.download -d work/input/gsi-zip >/dev/null
              found="$(find work/input/gsi-zip -iname 'system.img' | head -1)"
              [ -n "$found" ] || { echo "::error::no system.img inside the downloaded zip"; exit 1; }
              mv "$found" work/input/system.img
              ;;
            *XZ*)
              xz -d -c work/input/gsi.download > work/input/system.img
              ;;
            *)
              mv work/input/gsi.download work/input/system.img
              ;;
          esac
          rm -rf work/input/gsi.download work/input/gsi-zip
          ls -lh work/input

      - name: Bake the default profile
        run: echo "${{ inputs.profile }}" > src/profiles/DEFAULT

      - name: Build
        run: make image

      - name: Size report
        run: make sizes

      - name: Convert for VirtualBox and Hyper-V
        run: |
          img=$(ls out/*.img)
          sudo apt-get install -y -qq qemu-utils
          qemu-img convert -f raw -O vdi  "$img" "${img%.img}.vdi"
          qemu-img convert -f raw -O vhdx "$img" "${img%.img}.vhdx"
          zstd -19 --rm "$img"

      - uses: actions/upload-artifact@v4
        with:
          name: androws-${{ inputs.profile }}
          path: out/*
          retention-days: 14
